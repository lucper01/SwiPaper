<!doctype html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf6"><meta name="description" content="Swipaper : découvrez les publications qui correspondent vraiment à votre recherche.">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
<title>Swipaper | Love at first abstract</title></head><body>
<div id="app" class="app-shell">
<aside class="sidebar">
  <a href="./" class="brand" aria-label="Swipaper, accueil"><img class="brand-logo-img" src="./assets/icon.svg" alt="" width="53" height="53"><span class="brand-wordmark">swipaper<small></small></span></a>
  <p class="side-label">VOTRE ESPACE</p>
  <nav class="side-nav" aria-label="Navigation principale">
    <button class="nav-item active" data-view="discover"><span class="nav-icon">◈</span><span>Découvrir</span></button>
    <button class="nav-item" data-view="topics"><span class="nav-icon">⌕</span><span>Thématiques</span></button>
    <button class="nav-item" data-view="library"><span class="nav-icon">▤</span><span>Bibliothèque</span><span class="count" id="saved-count">0</span></button>
    <button class="nav-item" data-view="history"><span class="nav-icon">◷</span><span>Historique</span></button>
    <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Paramètres</span></button>
  </nav>
  <div class="sidebar-bottom"><div class="sidebar-illustration"><img src="./assets/giraffe-library.svg" alt="" width="72" height="72"></div></div>
</aside>
<div class="main-area">
  <header class="topbar">
    <a class="mobile-brand" href="./" aria-label="Swipaper, accueil"><img src="./assets/icon.svg" alt=""><span>swipaper</span></a>
    <div class="breadcrumbs"><span id="breadcrumb">Découvrir</span><span class="tiny" aria-hidden="true"> </span></div>
    <div class="top-actions"><span class="online-dot" id="online-dot"></span><span id="online-label">En ligne</span><button class="install-button" id="install-button" hidden>Installer l’app</button></div>
  </header>
  <main id="view" tabindex="-1"><div class="loading-placeholder">Préparation de votre espace de recherche…</div></main>
</div>
<nav class="mobile-nav" aria-label="Navigation mobile">
  <button data-view="discover" class="active"><span>◈</span><small>Découvrir</small></button>
  <button data-view="topics"><span>⌕</span><small>Thèmes</small></button>
  <button data-view="library"><span>▤</span><small>Articles</small></button>
  <button data-view="history"><span>◷</span><small>Sessions</small></button>
  <button data-view="settings"><span>⚙</span><small>Réglages</small></button>
</nav>
</div><div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script>
(function(){
  var recovered=false;
  var reason='';
  function displayFailure(){
    var view=document.getElementById('view');
    if(!view||!view.querySelector('.loading-placeholder')||recovered)return;
    recovered=true;
    view.innerHTML='<section class="panel" style="max-width:570px;margin:40px auto;padding:28px">'+
    '<h1 style="font-size:23px;margin:0 0 12px;color:#205b43">Impossible de charger Swipaper</h1>'+
    '<p style="color:#536f5f;line-height:1.7">Un fichier de l’application n’a pas pu être chargé. Vos articles et paramètres sont conservés.</p>'+
    '<div class="button-row"><button type="button" id="retry-swipaper" class="btn">Réessayer</button>'+
    '<button type="button" id="refresh-swipaper" class="btn secondary">Actualiser l’application</button></div>'+
    '<p id="swipaper-startup-diagnostic" style="margin-top:16px;font-size:11px;color:#789080"></p></section>';
    var diag=document.getElementById('swipaper-startup-diagnostic');
    if(diag)diag.textContent=reason?'Information technique : '+reason:'';
    var retry=document.getElementById('retry-swipaper');
    if(retry)retry.addEventListener('click',function(){location.reload()});
    var refresh=document.getElementById('refresh-swipaper');
    if(refresh)refresh.addEventListener('click',async function(){
      refresh.disabled=true;
      try{
        if('serviceWorker' in navigator){
          var regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(function(reg){return reg.scope.includes('/SwiPaper/')}).map(function(reg){return reg.unregister()}));
        }
        if('caches' in window){
          var keys=await caches.keys();
          await Promise.all(keys.filter(function(key){return key.indexOf('swipaper-')===0}).map(function(key){return caches.delete(key)}));
        }
      }catch(e){console.warn('PWA refresh failed',e)}
      location.replace(location.pathname+'?fresh='+Date.now()+location.hash);
    });
  }
  window.addEventListener('error',function(e){
    reason=e.message||'Erreur de chargement du module';
    setTimeout(displayFailure,100);
  },true);
  window.addEventListener('unhandledrejection',function(e){
    reason=String(e.reason&&e.reason.message||e.reason||'Promesse rejetée');
    setTimeout(displayFailure,100);
  });
  setTimeout(displayFailure,4500);
})();
</script>
<script type="module" src="./src/app.js?v=20261101-recovery"></script></body></html>
